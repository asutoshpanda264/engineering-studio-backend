spring:
  application:
    name: engineering-studio-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/engineering_studio}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    # `validate`, never `update`/`create` — Flyway (db/migration/) is the
    # single source of schema truth. Hibernate only checks the entity
    # mappings agree with whatever schema Flyway already produced, and
    # fails fast at startup if they've drifted apart, instead of silently
    # patching the schema to match Java code (which is exactly the
    # unreviewable, unreproducible drift Flyway was chosen to avoid —
    # see decisions.md #4).
    hibernate:
      ddl-auto: validate
    # Disables Open Session In View — with it on (Spring Boot's default),
    # Hibernate keeps the DB session open for the entire request including
    # view rendering, which invites lazy-loading queries to fire outside
    # the service layer's transaction boundary, hiding N+1s. Off means any
    # lazy association accessed outside a @Transactional method throws
    # immediately in dev, which is the point — better to find that at
    # dev-time than in a prod stack trace.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      # Not the source of truth for anything — leaderboard.LeaderboardService
      # treats this connection purely as a rebuildable projection of
      # problem_progress. Same env-override pattern as `datasource` above.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    # Auto-configures a RedisCacheManager over the SAME Redis connection
    # above — explicit rather than left to auto-detection, same "say what
    # you mean" preference as every other infra choice in this file.
    type: redis
    redis:
      # Safety-net TTL, not the primary consistency mechanism —
      # ScenarioService evicts explicitly on every mutation (publish,
      # archive, update). This just bounds the damage of a missed eviction
      # to 10 minutes instead of forever. See
      # phase-8-caching-and-rate-limiting/decisions.md.
      time-to-live: 10m

  flyway:
    enabled: true
    # Flyway's own `${placeholder}` templating is unrelated to Postgres's
    # dollar-quoting ($tag$...$tag$) — but the two collide textually: a
    # dollar-quote tag immediately followed by JSON content starting with
    # `{` (e.g. `$j${"type":"constant",...}`, from the scenario seed
    # migration) reads to Flyway's parser as an unconfigured `${...}`
    # placeholder reference and fails the whole migration. This project has
    # no legitimate use for Flyway placeholders, so disabling the feature
    # entirely avoids this collision for every current and future
    # JSON-embedding migration, not just the one that first hit it — see
    # masterdoc/phase-2-scenario-crud/decisions.md.
    placeholder-replacement: false

app:
  jwt:
    # Dev-only fallback — real deploys must set JWT_SECRET explicitly.
    # HS256 requires >= 256 bits; this default is well over that so local
    # dev never fails on key length, only on "don't use this in prod."
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-real-deployment-not-for-production-use}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  verify-service:
    base-url: ${VERIFY_SERVICE_URL:http://localhost:4000}
    timeout-seconds: 10
  rate-limit:
    # Fixed 1-minute windows — see common.ratelimit.RateLimitFilter.
    # Generous enough not to interfere with legitimate use (a student
    # iterating quickly, a normal login/register flow), tight enough to
    # blunt brute-force/credential-stuffing and submit-spam.
    auth-requests-per-minute: 10
    submit-requests-per-minute: 20
  cors:
    # A single scalar env value binds fine to List<String> here (Spring
    # Boot's relaxed binding splits on commas) — CORS_ALLOWED_ORIGINS=
    # "https://foo.com,https://bar.com" works for a real multi-origin
    # deploy without any code change.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    # notification.EmailService (2026-09-19 chat) — the contributor-
    # approved congrats email. `host` unset (empty) by default: the
    # service treats a blank host as "not configured yet" and logs
    # instead of sending, so an approval never fails just because SMTP
    # isn't wired up. Set these via env vars once real SMTP credentials
    # exist (Gmail app password, Mailtrap, SendGrid, ...).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:no-reply@engineeringstudio.dev}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
